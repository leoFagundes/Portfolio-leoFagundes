<svg xmlns="http://www.w3.org/2000/svg" width="216" height="360" viewBox="0 0 216 360" role="img" aria-labelledby="lf-title">
  <title id="lf-title">LF · Leonardo Fagundes</title>
  <defs>
    <linearGradient id="lf-gradient" x1="0" y1="0" x2="216" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3CE7A2"/>
      <stop offset="1" stop-color="#069A63"/>
    </linearGradient>
  </defs>
  <g fill="url(#lf-gradient)">
    <!-- F: braço superior + haste, que passa por baixo do pé do L -->
    <path d="M48 120H216V144H72V208H48Z M48 248H72V360H48Z"/>
    <!-- L: haste + pé, que também forma o braço do meio do F -->
    <path d="M0 0H24V216H168V240H0Z"/>
  </g>
</svg>
